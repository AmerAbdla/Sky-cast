<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#7CE7F2"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C5AA6"/>
      <stop offset="100%" stop-color="#0B3D6B"/>
    </linearGradient>
  </defs>

  <!-- Sun (peeking from behind the cloud) -->
  <circle cx="165" cy="95" r="32" fill="url(#sunGrad)"/>

  <!-- Sun rays -->
  <g stroke="#1FB6D8" stroke-width="6" stroke-linecap="round">
    <line x1="165" y1="61" x2="165" y2="37"/>
    <line x1="179.4" y1="64.2" x2="189.5" y2="42.4"/>
    <line x1="191.0" y1="73.1" x2="209.4" y2="57.7"/>
    <line x1="197.8" y1="86.2" x2="221.0" y2="80.1"/>
  </g>

  <!-- Cloud (built from overlapping same-fill shapes to form one solid silhouette) -->
  <g fill="url(#cloudGrad)">
    <circle cx="88" cy="128" r="34"/>
    <circle cx="128" cy="104" r="46"/>
    <circle cx="168" cy="130" r="30"/>
    <rect x="54" y="122" width="150" height="46" rx="23"/>
  </g>

  <!-- Wind swoosh beneath the cloud -->
  <g fill="none" stroke-linecap="round">
    <path d="M50,190 C90,175 150,175 190,190" stroke="#1FB6D8" stroke-width="8" opacity="0.9"/>
    <path d="M65,205 C100,195 140,195 175,205" stroke="#1FB6D8" stroke-width="7" opacity="0.55"/>
    <path d="M80,220 C105,213 130,213 155,220" stroke="#1FB6D8" stroke-width="6" opacity="0.3"/>
  </g>
</svg>
